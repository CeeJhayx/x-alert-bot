<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Post Feed</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#111; --muted:#667; --link:#1a6fe0; --line:#d5d9e0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1116; --card:#181c23; --text:#e8eaed; --muted:#8b93a1; --link:#5ca2ff; --line:#2c333d; }
  }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; }
  main { max-width:640px; margin:0 auto; }
  header { text-align:center; padding:20px 0 8px; }
  h1 { font-size:1.5rem; margin:0 0 6px; }
  .sub { color:var(--muted); margin:0; }
  #status { color:var(--muted); text-align:center; font-size:.85rem; margin:10px 0; }
  .card { background:var(--card); border-radius:12px; padding:14px; margin:12px 0; }
  .user { font-weight:600; }
  .time { color:var(--muted); font-size:.85rem; margin:2px 0 8px; }
  .text { white-space:pre-wrap; word-wrap:break-word; }
  a { color:var(--link); }
  .empty { text-align:center; padding:36px 20px; border:2px dashed var(--line); background:transparent; }
  .empty .icon { font-size:3rem; }
  .empty h2 { margin:8px 0; font-size:1.2rem; }
  .empty p { color:var(--muted); margin:6px 0; }
  button { margin-top:12px; padding:10px 18px; border:0; border-radius:8px; background:var(--link); color:#fff; font-size:1rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>X Post Feed</h1>
    <p class="sub">Latest posts from the accounts being watched</p>
  </header>
  <p id="status"></p>
  <div id="list"></div>
</main>
<script>
const list = document.getElementById("list");
const status = document.getElementById("status");

function showMessage(icon, title, line1, line2, withButton) {
  list.innerHTML = "";
  const box = document.createElement("div");
  box.className = "card empty";
  const i = document.createElement("div");
  i.className = "icon";
  i.textContent = icon;
  const h = document.createElement("h2");
  h.textContent = title;
  const p1 = document.createElement("p");
  p1.textContent = line1;
  box.append(i, h, p1);
  if (line2) {
    const p2 = document.createElement("p");
    p2.textContent = line2;
    box.appendChild(p2);
  }
  if (withButton) {
    const b = document.createElement("button");
    b.textContent = "Try again";
    b.onclick = load;
    box.appendChild(b);
  }
  list.appendChild(box);
}

function showEmpty() {
  status.textContent = "";
  showMessage(
    "📭",
    "No posts yet",
    "The bot checks for new posts every few minutes.",
    "They will appear here automatically once they are found.",
    false
  );
}

async function load() {
  status.textContent = "Loading…";
  try {
    const res = await fetch("posts.json?t=" + Date.now());
    if (res.status === 404) { showEmpty(); return; }
    if (!res.ok) throw new Error("bad response");
    const posts = await res.json();
    if (!posts.length) { showEmpty(); return; }
    list.innerHTML = "";
    status.textContent = "Updated " + new Date().toLocaleTimeString();
    for (const p of posts) {
      const card = document.createElement("div");
      card.className = "card";
      const u = document.createElement("div");
      u.className = "user";
      u.textContent = "@" + p.user;
      const t = document.createElement("div");
      t.className = "time";
      t.textContent = p.time ? new Date(p.time * 1000).toLocaleString() : "";
      const x = document.createElement("div");
      x.className = "text";
      x.textContent = p.text;
      const a = document.createElement("a");
      a.href = p.link;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "View on X";
      card.append(u, t, x, a);
      list.appendChild(card);
    }
  } catch (err) {
    status.textContent = "";
    showMessage(
      "⚠️",
      "Could not load posts",
      "Something went wrong while loading the feed.",
      "Check your connection and try again.",
      true
    );
  }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
